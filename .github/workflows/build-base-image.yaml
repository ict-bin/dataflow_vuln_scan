name: build-base-image

# 构建稳定基础镜像 (Dockerfile.base: ubuntu+apt+node+pi-coding-agent+venv+patch)
# 只在 Dockerfile.base 变更时触发 (基础层不随代码变); 也可手动 dispatch
# 产物: ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:{latest,<date-sha>}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.base"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate date tag
        id: date
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${COMMIT_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and push base amd64
        run: |
          docker buildx build --progress=plain --platform linux/amd64 \
            --cache-from type=gha,scope=dvs-base-amd64 \
            --cache-to type=gha,scope=dvs-base-amd64,mode=max \
            --file Dockerfile.base \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:amd64-latest \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:amd64-${{ needs.prepare.outputs.date_tag }} \
            --push .

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and push base arm64
        run: |
          docker buildx build --progress=plain --platform linux/arm64 \
            --cache-from type=gha,scope=dvs-base-arm64 \
            --cache-to type=gha,scope=dvs-base-arm64,mode=max \
            --file Dockerfile.base \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:arm64-latest \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:arm64-${{ needs.prepare.outputs.date_tag }} \
            --push .

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Merge base multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:latest \
            ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:amd64-latest \
            ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:arm64-latest
          docker buildx imagetools create \
            --tag ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:amd64-${{ needs.prepare.outputs.date_tag }} \
            ghcr.io/gaiasechw/secflow-app-dataflow-vuln-scan-base:arm64-${{ needs.prepare.outputs.date_tag }}
