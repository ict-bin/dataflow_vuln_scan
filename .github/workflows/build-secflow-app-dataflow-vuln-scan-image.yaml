name: build-secflow-app-dataflow-vuln-scan-image

# 独立构建 (本仓即源码, 不依赖 sothoth 主仓 submodule, 不依赖任何私有基础镜像)
# Dockerfile 自包含: FROM 公开 python:3.11 (完整版, 含 procps/util-linux 等调试工具)
# 产物: 推到子仓自己的 GHCR 路径 ghcr.io/<owner>/<repo>:{latest,<date-sha>} (amd64+arm64)
#
# 前置 Secret (可选, 仅双推 Docker Hub 时配置): DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# GHCR 推送用内置 GITHUB_TOKEN (packages:write), 无需额外 PAT

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "USAGE.md"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.date.outputs.date_tag }}
      image_name: ${{ steps.img.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Generate image name (子仓自己的 GHCR 路径, 小写)
        id: img
        run: |
          LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${LOWER}" >> "$GITHUB_OUTPUT"
      - name: Generate date tag
        id: date
        env:
          MAIN_REPO_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${MAIN_REPO_SHA::7}"
          COMMIT_TS="$(git show -s --format=%ct "${MAIN_REPO_SHA}")"
          DATE_TAG="$(TZ=Asia/Shanghai date -d "@${COMMIT_TS}" +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
      - name: Docker Hub login (可选, 未配置则跳过)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "::notice::Docker Hub 凭据未配置, 跳过 Docker Hub 推送"
          fi
      - name: Build and push amd64 image
        run: |
          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --cache-from type=gha,scope=secflow-app-dataflow-vuln-scan-amd64 \
            --cache-to type=gha,scope=secflow-app-dataflow-vuln-scan-amd64,mode=max \
            --file Dockerfile \
            --tag ${{ needs.prepare.outputs.image_name }}:amd64-latest \
            --tag ${{ needs.prepare.outputs.image_name }}:amd64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            .

  build-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
      - name: Docker Hub login (可选, 未配置则跳过)
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          else
            echo "::notice::Docker Hub 凭据未配置, 跳过 Docker Hub 推送"
          fi
      - name: Build and push arm64 image
        run: |
          docker buildx build \
            --progress=plain \
            --platform linux/arm64 \
            --build-arg SECFLOW_BUILD_VERSION=${{ needs.prepare.outputs.date_tag }} \
            --cache-from type=gha,scope=secflow-app-dataflow-vuln-scan-arm64 \
            --cache-to type=gha,scope=secflow-app-dataflow-vuln-scan-arm64,mode=max \
            --file Dockerfile \
            --tag ${{ needs.prepare.outputs.image_name }}:arm64-latest \
            --tag ${{ needs.prepare.outputs.image_name }}:arm64-${{ needs.prepare.outputs.date_tag }} \
            --push \
            .

  merge-manifest:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
      - name: Create and push multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            --tag ${{ needs.prepare.outputs.image_name }}:latest \
            ${{ needs.prepare.outputs.image_name }}:amd64-latest \
            ${{ needs.prepare.outputs.image_name }}:arm64-latest
      - name: Create and push multi-arch manifest (date tag)
        run: |
          docker buildx imagetools create \
            --tag ${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.date_tag }} \
            ${{ needs.prepare.outputs.image_name }}:amd64-${{ needs.prepare.outputs.date_tag }} \
            ${{ needs.prepare.outputs.image_name }}:arm64-${{ needs.prepare.outputs.date_tag }}
